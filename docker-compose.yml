services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drugctl
      POSTGRES_PASSWORD: drugctl
      POSTGRES_DB: drugctl
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drugctl -d drugctl"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
